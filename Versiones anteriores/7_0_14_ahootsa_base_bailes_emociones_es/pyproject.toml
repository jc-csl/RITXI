[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahootsa-realtime-ollama-desktop-app"
version = "7.0.14"
description = "Ahootsa 7.0.14: base estable con bailes y emociones en español, aliases robustos y diagnóstico de recursos"
requires-python = ">=3.10"
authors = [{ name = "Ahootsa / Centro San Luis" }]

[project.entry-points."reachy_mini_apps"]
ahootsa_realtime_ollama_app = "ahootsa_realtime_ollama_desktop_app.main:AhootsaRealtimeOllamaApp"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ahootsa_realtime_ollama_desktop_app = [
  "profiles/**/*.txt", "profiles/**/*.py",
  "tools/*.py", "tools/*.json", "tools/*.html", "tools/*.txt", "tools/*.md", "tools/*.ini", "tools/*.cfg", "tools/*.yaml", "tools/*.yml",
  "assets/*.png", "assets/*.jpg", "assets/*.svg"
]
