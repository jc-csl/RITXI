[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahootsa-realtime-ollama-desktop-app"
version = "5.0.44"
description = "Ahootsa 5.0.44: base estable instalable con motor Hugging Face oficial y Ollama auxiliar"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ahootsa / Centro San Luis" }]

[project.entry-points."reachy_mini_apps"]
ahootsa_realtime_ollama_app = "ahootsa_realtime_ollama_desktop_app.main:AhootsaRealtimeOllamaApp"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ahootsa_realtime_ollama_desktop_app = [
  "profiles/**/*.txt",
  "tools/*.py", "tools/*.json", "tools/*.html", "tools/*.txt", "tools/*.md",
  "games/*.html", "games/*.json", "assets/*.png"
]
