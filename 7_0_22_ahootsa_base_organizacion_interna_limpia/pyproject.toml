[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahootsa-realtime-ollama-desktop-app"
version = "7.0.22"
description = "Ahootsa 7.0.22: organización interna limpia sin cambios visibles"
requires-python = ">=3.10"
authors = [{ name = "Ahootsa / Centro San Luis" }]

[project.entry-points."reachy_mini_apps"]
ahootsa_realtime_ollama_app = "ahootsa_realtime_ollama_desktop_app.main:AhootsaRealtimeOllamaApp"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ahootsa_realtime_ollama_desktop_app = [
  "profiles/**/*.txt", "profiles/**/*.py",
  "tools/*.py",
  "data/**/*.json", "data/**/*.txt", "data/**/*.md",
  "config/**/*.json", "config/**/*.txt", "config/**/*.md", "config/**/*.ini", "config/**/*.cfg", "config/**/*.yaml", "config/**/*.yml",
  "templates/**/*.html", "templates/**/*.txt", "templates/**/*.md",
  "legacy/*.py", "legacy/*.md", "legacy/*.txt",
  "assets/*.png", "assets/*.jpg", "assets/*.svg",
  "README_ORGANIZACION_7_0_22.md"
]
