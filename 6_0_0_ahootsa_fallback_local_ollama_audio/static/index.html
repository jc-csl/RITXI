<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Ahootsa 6 Local</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Ahootsa 6</h1>
        <p>Fallback local con Ollama. Sin Hugging Face.</p>
      </div>
      <div id="statusBadge" class="badge">Comprobando...</div>
    </header>

    <section class="panel">
      <div class="controls">
        <button id="btnMic" class="primary">🎙️ Hablar</button>
        <button id="btnStop" class="secondary">⏹ Parar voz</button>
        <button id="btnReset" class="secondary">🔄 Reiniciar sesión</button>
      </div>

      <div class="inputRow">
        <input id="textInput" placeholder="Escribe o usa el micrófono..." />
        <button id="btnSend">Enviar</button>
      </div>

      <div class="quick">
        <button data-msg="Hola Ahootsa">Saludo</button>
        <button data-msg="Qué sabes hacer">Qué sabes hacer</button>
        <button data-msg="Quiero una actividad de comunicación">Actividad</button>
        <button id="btnMemory">Memory</button>
      </div>
    </section>

    <section class="layout">
      <section class="chat" id="chat"></section>

      <aside class="side">
        <h2>Actividad</h2>
        <div class="levels">
          <button data-level="facil">Iniciación</button>
          <button data-level="normal">Avanzado</button>
          <button data-level="avanzada">Experto</button>
        </div>

        <h2>Memory</h2>
        <div id="memoryBoard" class="memory"></div>
        <div class="memoryPick">
          <input id="cardA" type="number" min="1" max="8" placeholder="1" />
          <input id="cardB" type="number" min="1" max="8" placeholder="4" />
          <button id="btnPick">Elegir</button>
        </div>

        <h2>Estado</h2>
        <pre id="statusText"></pre>
      </aside>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
